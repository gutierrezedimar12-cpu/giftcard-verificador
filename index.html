<script>

async function verificar(){

const params = new URLSearchParams(window.location.search);
const codigo = params.get("codigo");

const respuesta = await fetch("tarjetas.json");
const tarjetas = await respuesta.json();

const app = document.getElementById("app");

if(tarjetas[codigo]){

const t = tarjetas[codigo];

app.innerHTML = `

<div class="card">

<div class="logo">SPEEDMAX</div>

<div class="ok">✔</div>

<h1>Gift Card Auténtica</h1>

<div class="info">

<p><b>Código:</b> ${codigo}</p>

<p><b>Ganador:</b> ${t.cliente}</p>

<p><b>Premio:</b> ${t.premio}</p>

<p><b>Estado:</b> ${t.estado}</p>

</div>

</div>

`;

}else{

app.innerHTML = `

<div class="card">

<div class="error">✖</div>

<h1>Gift Card no válida</h1>

<p>El código consultado no existe.</p>

</div>

`;

}

}

verificar();

</script>
