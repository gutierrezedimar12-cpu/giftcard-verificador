<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verificación Gift Card</title>

<style>
body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#111;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    color:white;
}

.card{
    background:#1b1b1b;
    width:90%;
    max-width:420px;
    border-radius:20px;
    padding:30px;
    text-align:center;
    box-shadow:0 0 30px rgba(0,0,0,.4);
}

.ok{
    color:#34c759;
    font-size:55px;
}

.error{
    color:#ff3b30;
    font-size:55px;
}

h1{
    margin:15px 0;
}

.info{
    text-align:left;
    margin-top:25px;
}

.info p{
    margin:10px 0;
    font-size:18px;
}

.logo{
    font-size:28px;
    font-weight:bold;
    color:#ffcc00;
}
</style>

</head>
<body>

<div id="app"></div>

<script>

const tarjetas = {

GC001:{
cliente:"Ganador 1",
premio:"4 Suspensiones",
estado:"Activa"
},

GC002:{
cliente:"Ganador 2",
premio:"4 Suspensiones",
estado:"Activa"
},

GC003:{
cliente:"Ganador 3",
premio:"4 Suspensiones",
estado:"Activa"
}

};

const params=new URLSearchParams(window.location.search);
const codigo=params.get("codigo");

const app=document.getElementById("app");

if(tarjetas[codigo]){

const t=tarjetas[codigo];

app.innerHTML=`

<div class="card">

<div class="logo">
SPEEDMAX
</div>

<div class="ok">✔</div>

<h1>Gift Card Auténtica</h1>

<div class="info">

<p><b>Código:</b> ${codigo}</p>

<p><b>Ganador:</b> ${t.cliente}</p>

<p><b>Premio:</b> ${t.premio}</p>

<p><b>Estado:</b> ${t.estado}</p>

</div>

</div>

`;

}else{

app.innerHTML=`

<div class="card">

<div class="error">✖</div>

<h1>Gift Card no válida</h1>

<p>El código consultado no existe.</p>

</div>

`;

}

</script>

</body>
</html>
